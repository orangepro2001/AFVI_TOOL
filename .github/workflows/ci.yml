# CI for AFVI TOOLS (Windows only). Runs on every push to main and on pull requests.
#
#   core            Go: gofmt, vet, race tests (Linux)
#   core-windows    Go tests on a real Windows runner
#   gui-linux       the app itself on Linux: scripted UI journey + snapshot comparison (scripts/test-gui.sh)
#   package-windows cross-builds the Windows app with mingw-w64 into build/native-win and uploads it
#   smoke-windows   PLACEHOLDER (disabled): start the exe on windows-latest and run -selftest; enable once -selftest is verified on Windows
#   deploy          PLACEHOLDER (disabled). See deploy/README.md.
#
# Nothing here touches the machines 192.168.1.61/62/63: tests use temp directories.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: gofmt
        working-directory: core
        run: test -z "$(gofmt -l .)"
      - name: vet
        working-directory: core
        run: go vet ./...
      - name: test
        working-directory: core
        run: go test -race ./...

  core-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: test
        working-directory: core
        run: go test ./...

  gui-linux:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: toolchain and fonts (the baselines use DejaVu Sans and Noto Sans CJK)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc zlib1g-dev python3 fonts-dejavu-core fonts-noto-cjk
      - name: scripted UI journey and snapshot comparison
        run: scripts/test-gui.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gui-snapshot-failures
          path: shots/failed/*.png
          if-no-files-found: ignore

  package-windows:
    needs: [core, core-windows, gui-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 python3 bc fonts-dejavu-core
      - name: build
        run: scripts/build.sh --no-test
      - uses: actions/upload-artifact@v4
        with:
          name: AFVI-TOOLS-win
          path: build/native-win/AfviTools.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win32-preview
          path: shots/*.png
          if-no-files-found: ignore

  smoke-windows:
    if: ${{ false }}
    needs: package-windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AFVI-TOOLS-win
      - name: self-test on a real Windows
        run: .\AfviTools.exe -selftest "$env:RUNNER_TEMP\st"

  deploy:
    if: ${{ false && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    needs: package-windows
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "TODO: see deploy/README.md"
